<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puzzle Solver</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <h1 class="text-xl font-semibold tracking-tight">Puzzles</h1>
      <span id="progress" class="text-sm text-slate-500"></span>
    </div>
  </header>

  <main class="mx-auto grid max-w-5xl gap-6 px-4 py-6 md:grid-cols-[220px_1fr]">
    <!-- Sidebar: categories and puzzle list -->
    <nav id="sidebar" class="space-y-6"></nav>

    <!-- Puzzle view -->
    <section id="puzzle" class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm"></section>
  </main>

  <script src="js/puzzles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
